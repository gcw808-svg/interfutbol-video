name: kgcheck
# Kaggle'dagi diktor ishining holati va jurnali (vaqtinchalik kalit jurnalda yashiriladi)
on:
  workflow_dispatch:
    inputs:
      kernel:
        default: "baxtiyoraxrarov/inter-diktor-bakeoff"
      grep:
        description: "jurnaldan shu ifodaga mos qatorlar atrofini ko'rsatish"
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: pip install -q "kaggle>=1.8" six
      - env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL: ${{ inputs.kernel }}
          GREP: ${{ inputs.grep }}
        run: |
          kaggle kernels status "$KERNEL" 2>&1 | cut -c1-200 | head -3 || true
          # katta model fayllari bilan to'liq natijani yuklash uzoq cho'ziladi — avval faqat jurnal olinadi
          mkdir -p out
          (timeout 120 kaggle kernels logs "$KERNEL" > out/k.log 2>/dev/null) || (timeout 200 kaggle kernels output "$KERNEL" -p out --file-pattern '.*\.log$' > /dev/null 2>&1) || (timeout 600 kaggle kernels output "$KERNEL" -p out > /dev/null 2>&1) || true
          ls -la out | head -20
          for f in out/*.log; do [ -f "$f" ] && python3 -c "
          import json,sys,re
          try:
              rows=json.load(open(sys.argv[1]))
              txt=''.join(r.get('data','') for r in rows)
          except Exception:
              txt=open(sys.argv[1],errors='ignore').read()
          txt=re.sub(r'[0-9a-f]{48}','[K]',txt); txt=re.sub(r'hf_[A-Za-z0-9]+','[HF]',txt)
          import os
          pat=os.environ.get('GREP','')
          if pat:
              L=txt.split('\n')
              hit=[i for i,l in enumerate(L) if re.search(pat,l)]
              for i in hit[:6]:
                  print('--- GREP', i); print('\n'.join(x[:400] for x in L[max(0,i-2):i+22]))
          print(txt[-6000:])
          " "$f"; done; true
