name: archpost
# Kanal posti rasmini "Inter Futbol — Rasm generatsiya Arxiv" kanalidagi suratga almashtirish (2026-11-23, 427-post):
# m — arxiv xabari raqami (t.me/c/3533987068/<m>), post — kanal posti. Arxiv izohining 2-qatori Commons fayl nomi — rasm o'sha fayldan
# rasmfile.py orqali qayta chiziladi (litsenziya tekshiriladi, muallif yozuvi post matniga qo'shiladi). dry=1 — faqat izohni ko'rsatadi.
on:
  workflow_dispatch:
    inputs:
      m:
        default: ""
      file:
        default: ""   # ombordagi rasm fayli (masalan tmpimg/post435.png) — avval arxiv kanaliga fayl bo'lib tushadi, keyin postga qo'yiladi (m bo'sh)
      cap:
        default: ""   # file uchun arxivdagi izoh
      post:
        required: true
      wm:
        default: ""
      sharp:
        default: ""
      dry:
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          M: ${{ inputs.m }}
          FILE_IN: ${{ inputs.file }}
          CAP: ${{ inputs.cap }}
          POST: ${{ inputs.post }}
          WM: ${{ inputs.wm }}
          SHARP: ${{ inputs.sharp }}
          DRY: ${{ inputs.dry }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, requests
          ARCH = -1003533987068
          api = "https://api.telegram.org/bot" + os.environ["BOT_TOKEN"] + "/"
          if os.environ.get("FILE_IN"):
              # chatda berilgan rasm (omborga qo'yilgan fayl): arxiv kanaliga fayl bo'lib saqlanadi va o'sha nusxa postga qo'yiladi
              fp = os.environ["FILE_IN"]
              up = requests.post(api + "sendDocument", data={"chat_id": ARCH, "caption": (os.environ.get("CAP") or os.path.basename(fp))[:900], "disable_notification": True, "disable_content_type_detection": True}, files={"document": (os.path.basename(fp), open(fp, "rb").read())}, timeout=180).json()
              if not up.get("ok"):
                  print("- arxivga yuborilmadi:", up.get("description")); sys.exit(1)
              r = up["result"]; print("ARXIV", r["message_id"])
          else:
              fw = requests.post(api + "forwardMessage", data={"chat_id": ARCH, "from_chat_id": ARCH, "message_id": int(os.environ["M"]), "disable_notification": True}, timeout=60).json()
              if not fw.get("ok"):
                  print("- arxiv xabari o'qilmadi:", fw.get("description")); sys.exit(1)
              r = fw["result"]
              requests.post(api + "deleteMessage", data={"chat_id": ARCH, "message_id": r["message_id"]}, timeout=60)
          cap = (r.get("caption") or "").split("\n")
          print("izoh:", " | ".join(cap)[:400])
          d = r.get("document") or (r.get("photo") or [None])[-1]
          fid = d and d["file_id"]
          print("fayl:", fid, d and (d.get("file_size"), d.get("width"), d.get("height")))
          if os.environ.get("DRY"):
              sys.exit(0)
          if len(cap) < 2 or not cap[1].strip():
              # qo'lda tashlangan surat (izohda Commons fayl nomi yo'q) — arxivdagi faylning o'zi qo'yiladi, muallif yozuvisiz
              if not fid:
                  print("- xabarda surat yo'q"); sys.exit(1)
              import hashlib, json
              W = "https://inter-futbol-bot.gcw808.workers.dev"
              key = hashlib.sha256(("ub-" + os.environ["BOT_TOKEN"]).encode()).hexdigest()[:40]
              print("post:", requests.post(W + "/ub/rasm", headers={"x-key": key, "content-type": "application/json", "user-agent": "InterFutbolStadium"}, data=json.dumps({"id": int(os.environ["POST"]), "face": W + "/ph/" + fid + "?wide=1",  # wide=1: surat o'z shaklida qoladi (yotiq — yotiq, kvadrat — kvadrat, tik — tik), chetlari kesilmaydi (414-post)
                 "wm": "tr" if os.environ.get("WM") == "tr" else "", "sr": 1 if os.environ.get("SHARP") else 0}), timeout=60).text[:120])
              sys.exit(0)
          sys.exit(subprocess.run([sys.executable, "rasmfile.py"], env={**os.environ, "FILE": cap[1].strip()}).returncode)
          PY
