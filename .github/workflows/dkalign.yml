name: dkalign
# INTER DIKTOR — ovoz fayllarini Word matniga moslash (dk_align.py). Bot matn fayli kelganda ishga tushiradi (job = ish raqami).
# 2026-11-19: Modal bepul limiti (oyiga 1 $) tugagani uchun GitHub'ga ko'chirildi — ombor ochiq, daqiqalar bepul.
on:
  workflow_dispatch:
    inputs:
      job:
        required: true
concurrency:
  group: dkalign-${{ inputs.job }}  # har ish alohida: umumiy guruhda navbatdagi ish oldingisini bekor qilib yuborgan edi (2026-11-19)
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .dkcache
          key: dkcache-${{ github.run_id }}
          restore-keys: dkcache-
      - run: sudo apt-get update -qq > /dev/null 2>&1; sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1; pip install -q faster-whisper python-docx telethon cryptg numpy huggingface_hub && pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers
      - name: Moslash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          JOB: ${{ inputs.job }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DK_CACHE: ${{ github.workspace }}/.dkcache
          DK_HEAR_HF: islomov/rubaistt_v2_medium  # o'zbekchaga o'rgatilgan Whisper (Apache-2.0)
        run: python3 -c "import asyncio, os, dk_align; asyncio.run(dk_align.run(os.environ['JOB']))"
