name: tugma
# Kanal posti ostiga havola tugmasi qo'yish (har qanday https havola va yozuv bilan; mavjud tugmalar o'rnini bosadi) — 2026-11-16, 308-post "Madhiyani tinglaş"
on:
  workflow_dispatch:
    inputs:
      post:
        required: true
      url:
        required: true
      text:
        required: true
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          POST: ${{ inputs.post }}
          URL: ${{ inputs.url }}
          TXT: ${{ inputs.text }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = {"chat_id": "@Inter_Futbol_TV", "message_id": int(os.environ["POST"]), "reply_markup": {"inline_keyboard": [[{"text": os.environ["TXT"], "url": os.environ["URL"]}]]}}
          assert os.environ["URL"].startswith("https://")
          rq = urllib.request.Request("https://api.telegram.org/bot" + os.environ["BOT_TOKEN"] + "/editMessageReplyMarkup", data=json.dumps(body).encode(), headers={"content-type": "application/json"})
          try:
              r = json.load(urllib.request.urlopen(rq, timeout=30)); print("ok:", r.get("ok"))
          except urllib.error.HTTPError as e:
              print("xato:", e.read().decode()[:300]); raise SystemExit(1)
          PY
