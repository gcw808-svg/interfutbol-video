name: dktest
# Inter Diktor: moslash zanjirini sinash — tests/dk dagi sinov ovozi va matnini kanalga tashlab, moslashni ishga tushiradi (natija kanalga ZIP bo'lib tushadi)
on:
  workflow_dispatch:
    inputs:
      doc:
        description: "matn fayli xabari raqami — shu to'plamni qayta moslash"
        default: ""
      job:
        description: "bor ish raqami — faqat Modal'ni qayta chaqirish (fayl tashlanmaydi)"
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          JOB: ${{ inputs.job }}
          DOC: ${{ inputs.doc }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          key = hashlib.sha256(("ub-" + os.environ["BOT_TOKEN"]).encode()).hexdigest()[:40]
          if os.environ.get("DOC", "").startswith("del:"):
              ids = []
              for part in os.environ["DOC"][4:].split(","):
                  a, _, b = part.partition("-")
                  ids += list(range(int(a), int(b or a) + 1))
              rq = urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/ub/dkdel", data=json.dumps({"ids": ids, "old": 1, "lastdoc": int(os.environ.get("JOB") or 0)}).encode(), headers={"x-key": key, "content-type": "application/json", "user-agent": "dktest"})
              print("tozalash:", urllib.request.urlopen(rq, timeout=60).read().decode()[:300]); raise SystemExit(0)
          if os.environ.get("DOC", "").startswith("fw:"):
              rq = urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/ub/dkfw", data=json.dumps({"m": int(os.environ["DOC"][3:])}).encode(), headers={"x-key": key, "content-type": "application/json", "user-agent": "dktest"})
              print("kochirish:", urllib.request.urlopen(rq, timeout=60).read().decode()[:300]); raise SystemExit(0)
          if os.environ.get("DOC", "").startswith("word:"):  # kanaldagi Word faylni ovozga aylantirish sinovi (natija kanalga)
              rq = urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/ub/dktext", data=json.dumps({"doc": int(os.environ["DOC"][5:].split("|")[0]), "only": int(os.environ.get("JOB") or 0), "find": "|".join(os.environ["DOC"][5:].split("|")[1:])}).encode(), headers={"x-key": key, "content-type": "application/json", "user-agent": "dktest"})
              print("word:", urllib.request.urlopen(rq, timeout=60).read().decode()[:300]); raise SystemExit(0)
          if os.environ.get("DOC", "").startswith("say:"):
              rq = urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/ub/dktext", data=json.dumps({"t": os.environ["DOC"][4:]}).encode(), headers={"x-key": key, "content-type": "application/json", "user-agent": "dktest"})
              print("oqish:", urllib.request.urlopen(rq, timeout=60).read().decode()[:300]); raise SystemExit(0)
          if os.environ.get("DOC") == "say":  # matnni ovozga aylantirishni sinash (natija kanalga namuna_sinov bo'lib tushadi)
              rq = urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/ub/dktext", data=json.dumps({"t": "2026-yil 19-noyabr kuni Real Madrid 3:1 hisobida g'alaba qozondi. Jamoa 45 foiz to'pga egalik qildi."}).encode(), headers={"x-key": key, "content-type": "application/json", "user-agent": "dktest"})
              print("oqish:", urllib.request.urlopen(rq, timeout=60).read().decode()[:300]); raise SystemExit(0)
          if os.environ.get("DOC") == "ping":
              rq = urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/ub/dkping", headers={"x-key": key, "user-agent": "dktest"})
              print("ping:", urllib.request.urlopen(rq, timeout=60).read().decode()[:400]); raise SystemExit(0)
          if os.environ.get("DOC"):
              rq = urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/ub/dkredo", data=json.dumps({"doc": int(os.environ["DOC"])}).encode(), headers={"x-key": key, "content-type": "application/json", "user-agent": "dktest"})
              print("qayta:", urllib.request.urlopen(rq, timeout=240).read().decode()[:300]); raise SystemExit(0)
          if os.environ.get("JOB"):
              import urllib.error
              rq = urllib.request.Request("https://gcw808-svg--inter-jobs-dispatch.modal.run", data=json.dumps({"wf": "dkalign.yml", "job": os.environ["JOB"]}).encode(), headers={"x-key": key, "content-type": "application/json"})
              try:
                  r = urllib.request.urlopen(rq, timeout=120); print("modal:", r.status, r.read().decode()[:300])
              except urllib.error.HTTPError as e:
                  print("modal xato:", e.code, e.read().decode()[:500])
              raise SystemExit(0)
          body = {"audio": base64.b64encode(open("tests/dk/sinov.mp3", "rb").read()).decode(), "doc": base64.b64encode(open("tests/dk/sinov.txt", "rb").read()).decode()}
          rq = urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/ub/dktest", data=json.dumps(body).encode(), headers={"x-key": key, "content-type": "application/json", "user-agent": "InterDiktorTest"})
          print(urllib.request.urlopen(rq, timeout=120).read().decode()[:300])
          PY
