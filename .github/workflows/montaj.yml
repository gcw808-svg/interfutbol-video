name: montaj
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Vazifa nomi (worker'dagi dsp:<job>)"
        default: imgjob
      engine:
        description: "hf | gemini"
        default: hf
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Multfilm rasmlari (Gemini)
        if: inputs.engine == 'gemini'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          IMGJOB: ${{ inputs.job }}
        run: python gimg.py
      - name: Multfilm rasmlari (Hugging Face)
        if: inputs.engine != 'gemini'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          IMGJOB: ${{ inputs.job }}
        run: |
          pip install -q gradio_client
          python gimg_hf.py
