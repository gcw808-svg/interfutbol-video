name: ubpost
on:
  workflow_dispatch:
    inputs:
      job:
        required: true
jobs:
  run:
    runs-on: ubuntu-slim  # 1 vCPU ishchi — daqiqasi oddiysidan 3 baravar arzon (Modal o'chganda zaxira; 2026-11-19)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install telethon && (pip install cryptg || true)
      - name: Chiqarish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          JOB: ${{ inputs.job }}
        run: python3 ub.py post
