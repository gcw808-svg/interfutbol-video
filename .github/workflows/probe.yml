name: probe
# Manbalarni tekshirish: berilgan URL'lar ochiladimi, RSS/JSON bo'lsa nechta yozuv va birinchi sarlavhalar (yangi yangilik manbalarini qo'shishdan oldin)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL'lar (bo'sh joy bilan)"
        required: true
      grep:
        description: "ixtiyoriy: javobdan qidiriladigan so'zlar (regex)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          URLS: ${{ github.event.inputs.urls }}
          GREP: ${{ github.event.inputs.grep }}
        run: |
          for u in $URLS; do
            echo "=== $u"
            code=$(curl -sSL -m 20 -A "Mozilla/5.0 (compatible; InterFutbolBot/1.1)" -o body -w "%{http_code} %{content_type} %{size_download}" "$u" || echo "ERR")
            echo "$code"
            python3 - <<'PY' || true
          import re
          import os
          s=open("body",encoding="utf8",errors="ignore").read()
          g=os.environ.get("GREP","")
          if g:
              for m in list(re.finditer(g,s,re.I))[:25]: print("  >>", s[max(0,m.start()-160):m.end()+220].replace("\n"," "))
          items=re.findall(r"<(item|entry)\b",s)
          print("items:",len(items))
          t=re.findall(r"<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>",s,re.S)[1:4]
          d=re.findall(r"<(?:pubDate|updated|published)>(.*?)</",s)[:3]
          print("titles:",[x.strip()[:90] for x in t]); print("dates:",d)
          print("img:", bool(re.search(r"<enclosure|<media:(content|thumbnail)",s)))
          if "tgme_widget_message" in s:
              ps=s.split('data-post="')[1:]
              print("tg posts:",len(ps))
              for x in ps[:40]:
                  v=re.search(r'tgme_widget_message_views">([^<]+)<',x); t=re.search(r'<time datetime="([^"]+)"',x); tx=re.search(r'js-message_text[^>]*>([\s\S]*?)</div>',x)
                  print(x[:25].split('"')[0], v and v.group(1), t and t.group(1), re.sub(r"<[^>]+>","",tx.group(1))[:70] if tx else None)
          elif not items: print(s[:300].replace("\n"," "))
          PY
          done
