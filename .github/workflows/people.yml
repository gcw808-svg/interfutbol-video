name: people
# Odamlar roboti: futbolchi va murabbiylarning erkin litsenziyali suratlarini (Wikimedia Commons) rasmlar kanaliga va bot bazasiga qo'shadi (people.py)
# 2026-11-18: GitHub daqiqalarini tejash uchun ish MODAL'da bajariladi (bu workflow faqat ishga tushiradi, ~1 daqiqa); natija bot KV'siga (peopleLog) yoziladi —
# o'qish: worker.yml action=holat keys=peopleLog. gh=1 — eski usul (shu yerda bajarish).
# 2026-11-19 (Bahtiyor aka: "bazani tinimsiz, bir necha manbadan yangilab tur"): HAR KUNI 02:23 (Toshkent) da o'zi ishga tushadi — AUTO rejim, aylanma navbat,
# GitHub'ning o'zida (ombor ochiq, daqiqalar bepul; Modal bepul limiti kichik). Natija bot KV'sida: worker.yml action=holat keys=peopleLog.
# Har ishga tushishdan keyin yangi suratlar KO'ZDAN KECHIRILADI (nazorat vazifasi) va yaroqsizlari del bilan olib tashlanadi. gh=0 — Modal'da.
# src_off — manbani o'chirish (vergul bilan): wiki, depicts, openverse.
# only — faqat shu ismlar (vergul bilan); add — ro'yxatda yo'q yangi ismlar; per — bir odamga nechta; limit — jami; dry=1 — faqat hisobot; del/reg — JSON
on:
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:
    inputs:
      only:
        default: ""
      add:
        default: ""
      per:
        default: "2"
      limit:
        default: "40"
      maxp:
        default: "4"
      dry:
        default: "0"
      del:
        default: ""
      reg:
        default: ""
      maxsec:
        default: "2700"
      gh:
        default: "1"
      auto:
        default: "0"
      src_off:
        default: "openverse"
      arch:
        default: "0"
permissions:
  contents: read
concurrency:
  group: sharp
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ONLY: ${{ inputs.only }}
      ADD: ${{ inputs.add }}
      PER: ${{ inputs.per || '2' }}
      LIMIT: ${{ inputs.limit || '30' }}
      MAXP: ${{ github.event_name == 'schedule' && '8' || inputs.maxp }}
      AUTO: ${{ github.event_name == 'schedule' && '1' || inputs.auto }}
      SRC_OFF: ${{ github.event_name == 'schedule' && 'openverse' || inputs.src_off }}
      REPORT: "1"
      ARCH_LIMIT: ${{ github.event_name == 'schedule' && '250' || inputs.arch }}  # "Inter Futbol — Rasm generatsiya Arxiv" kanaliga bir ishda nechta surat (0 — o'chiq)
      DRY: ${{ inputs.dry }}
      DEL: ${{ inputs.del }}
      REG: ${{ inputs.reg }}
      MAXSEC: ${{ inputs.maxsec || '3600' }}
    steps:
      - if: ${{ inputs.gh == '0' }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          key = hashlib.sha256(("ub-" + os.environ["BOT_TOKEN"]).encode()).hexdigest()[:40]
          job = {k: os.environ.get(k, "") for k in ("ONLY", "ADD", "PER", "LIMIT", "MAXP", "DRY", "DEL", "REG", "MAXSEC") if os.environ.get(k, "")}
          rq = urllib.request.Request("https://gcw808-svg--inter-jobs-dispatch.modal.run", data=json.dumps({"wf": "people.yml", "job": json.dumps(job, ensure_ascii=False)}).encode(), headers={"x-key": key, "content-type": "application/json"})
          print("modal:", urllib.request.urlopen(rq, timeout=60).read().decode()[:200])
          PY
      - if: ${{ inputs.gh != '0' }}
        uses: actions/checkout@v4
      - if: ${{ inputs.gh != '0' }}
        run: pip install -q requests pillow numpy onnxruntime && python3 people.py
