name: slimtest
# Sinov: arzon "ubuntu-slim" (1 vCPU) ishchisi bizning yengil ishlarimizga yaraydimi (GitHub daqiqalarini tejash, 2026-11-18)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          uname -a; nproc; free -m | head -2
          for t in python3 pip3 node curl jq git gh; do printf "%s: " $t; (command -v $t >/dev/null && $t --version 2>&1 | head -1) || echo YO\'Q; done
          python3 -c "import urllib.request, hashlib, json; print('python ok')"
          node --check worker/worker.js && echo "node check ok"
