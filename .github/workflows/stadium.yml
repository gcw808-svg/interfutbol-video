name: stadium
# Stadion roboti: erkin litsenziyali stadion suratlarini (Wikimedia Commons) rasmlar kanaliga va bot bazasiga qo'shadi (haftasiga bir marta)
on:
  workflow_dispatch:
    inputs:
      limit:
        default: "15"
      redo:
        default: ""
      file:
        default: ""
      sname:
        default: ""
      club:
        default: ""
      post:
        default: ""
  schedule:
    - cron: "41 2 * * 3"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests pillow numpy onnxruntime
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LIMIT: ${{ inputs.limit || '15' }}
          REDO: ${{ inputs.redo }}
          FILE: ${{ inputs.file }}
          SNAME: ${{ inputs.sname }}
          CLUB: ${{ inputs.club }}
          POST: ${{ inputs.post }}
        run: python3 stadium.py
