name: oldbase
# Eski diktor o'qitilgan audiolar qayerdadir saqlanib qolganmi — Kaggle natijalari va muharrir boti chatini ko'rib chiqish (kalitlar chiqarilmaydi)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "kaggle>=1.8" six telethon cryptg
      - env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import asyncio, hashlib, json, os, urllib.request
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          key = hashlib.sha256(("ub-" + os.environ["BOT_TOKEN"]).encode()).hexdigest()[:40]
          j = json.loads(urllib.request.urlopen(urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/ub/dksweep", headers={"x-key": key, "user-agent": "oldbase"}), timeout=120).read())
          async def main():
              c = TelegramClient(StringSession(j["session"]), int(os.environ["TG_API_ID"]), os.environ["TG_API_HASH"])
              await c.connect()
              found = {}
              async for d in c.iter_dialogs(limit=300):
                  n = a = 0; sec = 0; first = last = None; docs = 0
                  if not (d.is_user or (d.is_channel and getattr(d.entity, "creator", False))):
                      continue
                  async for m in c.iter_messages(d.entity, limit=1500):
                      f = m.file
                      if not f:
                          continue
                      mt = (f.mime_type or "")
                      if mt.startswith("audio/") or m.voice:
                          a += 1; sec += (f.duration or 0); last = last or m.date; first = m.date
                      elif (f.name or "").lower().endswith((".docx", ".txt")):
                          docs += 1
                  if a >= 5:
                      kind = "bot" if (d.is_user and getattr(d.entity, "bot", False)) else ("o'zim" if d.is_user and getattr(d.entity, "is_self", False) else ("kanal" if d.is_channel else "shaxs"))
                      title = d.name if kind in ("bot", "kanal", "o'zim") else "(shaxsiy suhbat)"
                      if kind == "kanal":
                          continue
                      found[d.id] = f"• {d.name} — {a} ta audio ({sec/60:.0f} daqiqa), {docs} ta Word/matn fayli, {str(first)[:10]} dan {str(last)[:10]} gacha"
                      print(f"SUHBAT [{kind}] topildi: {a} ta audio, {docs} ta matn fayli")  # nomi jurnalga chiqarilmaydi (jurnal ochiq)
              await c.disconnect()
              if found:  # ro'yxat NOMLARI bilan faqat yopiq kanalga (Bahtiyor akaning o'ziga) yuboriladi
                  kk = json.loads(urllib.request.urlopen(urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/ub/dkkey", data=b"{}", headers={"x-key": key, "content-type": "application/json", "user-agent": "oldbase"}), timeout=120).read())["k"]
                  txt = "Telegram hisobingizda audio va Word fayllar bor suhbatlar (qaysi birida diktor yozuvlari borligini aniqlash uchun):\n\n" + "\n".join(found.values()) + "\n\nBu xabarni faqat siz ko'rasiz. Claude'ga qaysi suhbat ekanini ayting."
                  urllib.request.urlopen(urllib.request.Request("https://inter-futbol-bot.gcw808.workers.dev/dkx/say?k=" + kk, data=json.dumps({"text": txt}).encode(), headers={"content-type": "application/json", "user-agent": "oldbase"}), timeout=60).read()
                  print("ro'yxat kanalga yuborildi:", len(found), "ta suhbat")
          asyncio.run(main())
          PY
