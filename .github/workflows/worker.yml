name: worker
# Bot kodini (Cloudflare Worker "inter-futbol-bot") kompyutersiz boshqarish:
#   pull  — Cloudflare'dagi joriy kodni worker/worker.js ga yozib saqlaydi (zaxira nusxa, tarix bilan)
#   deploy — worker/worker.js ni Cloudflare'ga joylaydi (faqat kod; sozlamalar, KV, kalitlar, cron o'zgarmaydi)
#   holat — botning ichki holatini (tekshiruvlar, oxirgi istoriyalar) ko'rsatadi; maxfiy qiymatlar hech qachon chiqarilmaydi
# worker/worker.js main'ga push qilinsa, avtomatik joylanadi.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "pull | deploy | holat"
        required: true
        default: holat
      keys:
        description: "holat uchun qo'shimcha KV kalit nomlari (vergul bilan)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["worker/worker.js"]
concurrency:
  group: worker
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF: ${{ secrets.CF_API_TOKEN }}
      ACC: 02978f487b30cf4acdedbfa8d728325f
      SCRIPT: inter-futbol-bot
      ACT: ${{ github.event_name == 'push' && 'deploy' || inputs.action }}
      KEYS: ${{ inputs.keys }}
    steps:
      - uses: actions/checkout@v4
      - name: Kalit bormi
        run: |
          if [ -z "$CF" ]; then echo "CF_API_TOKEN sirri qo'yilmagan"; exit 1; fi
          echo "::add-mask::$CF"
      - name: Kodni olish (pull)
        if: env.ACT == 'pull'
        run: |
          curl -sS -D /tmp/h -o /tmp/b "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$SCRIPT/content/v2" -H "Authorization: Bearer $CF"
          python3 - <<'EOF'
          import email, os, sys
          h = open("/tmp/h", "rb").read().decode("latin-1")
          ct = next((l.split(":", 1)[1].strip() for l in h.splitlines() if l.lower().startswith("content-type:")), "")
          b = open("/tmp/b", "rb").read()
          if "multipart" not in ct:
              print("kutilmagan javob:", ct, b[:300]); sys.exit(1)
          m = email.message_from_bytes(b"Content-Type: " + ct.encode() + b"\r\n\r\n" + b)
          parts = [p for p in m.walk() if not p.is_multipart()]
          js = [p for p in parts if (p.get_param("name", header="content-disposition") or "").endswith(".js")]
          if len(js) != 1:
              print("js qismlar:", [p.get_param("name", header="content-disposition") for p in parts]); sys.exit(1)
          os.makedirs("worker", exist_ok=True)
          open("worker/worker.js", "wb").write(js[0].get_payload(decode=True))
          print("olindi:", js[0].get_param("name", header="content-disposition"), len(js[0].get_payload(decode=True)), "bayt")
          EOF
          cp worker/worker.js /tmp/w.mjs && node --check /tmp/w.mjs
          git config user.name "worker-sync"
          git config user.email "worker-sync@users.noreply.github.com"
          git add worker/worker.js
          if git diff --cached --quiet; then echo "o'zgarish yo'q"; else git commit -m "worker: Cloudflare'dagi joriy kod" && git push; fi
      - name: Joylash (deploy)
        if: env.ACT == 'deploy'
        run: |
          cp worker/worker.js /tmp/w.mjs && node --check /tmp/w.mjs
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$SCRIPT/content" \
            -H "Authorization: Bearer $CF" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F "worker.js=@worker/worker.js;type=application/javascript+module" > /tmp/r.json
          jq '{success, errors, messages}' /tmp/r.json
          jq -e '.success == true' /tmp/r.json > /dev/null
          sleep 5
          curl -sS -o /dev/null -w "bot javobi: %{http_code}\n" "https://$SCRIPT.gcw808.workers.dev/"
      - name: Holat
        if: env.ACT == 'holat'
        run: |
          NS=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$SCRIPT/settings" -H "Authorization: Bearer $CF" | jq -r '.result.bindings[] | select(.type=="kv_namespace" and .name=="STATE") | .namespace_id')
          [ -n "$NS" ] || { echo "KV topilmadi"; exit 1; }
          LIST="alertLog,qcHeld,qcSeen,healthDay,healthTg,storyLast,igLast,rsDay,tblDay,cronErr,cronLog,igMode,storyMode,orMode,tblMode${KEYS:+,$KEYS}"
          for k in ${LIST//,/ }; do
            if echo "$k" | grep -qiE '(sess|key|token|secret|pass|auth|^ig$|^admins?$|^usess|^or|api|tgph|cred)' && ! echo "$k" | grep -qE '^(orMode|igMode|igLast)$'; then echo "$k: (maxfiy — ko'rsatilmaydi)"; continue; fi
            v=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces/$NS/values/$k" -H "Authorization: Bearer $CF")
            # alohida so'ralgan kalit (keys) to'liq chiqariladi — odamlar roboti hisoboti (peopleLog) uzun bo'ladi (2026-11-18)
            if echo ",$KEYS," | grep -q ",$k,"; then echo "$k: ${v:0:900000}"; else echo "$k: ${v:0:20000}"; fi
          done
          echo "Hozir (Toshkent): $(TZ=Asia/Tashkent date '+%F %T')"
